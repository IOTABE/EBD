{% extends 'base.html' %}

{% block title %}Entrar — EBD Gestão{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">Acesso restrito</h3>

                {% if form.errors %}
                    <div class="alert alert-danger" role="alert">
                        Usuário ou senha inválidos. Tente novamente.
                    </div>
                {% endif %}

                <form method="post" novalidate>
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="{{ form.username.id_for_label }}" class="form-label">Usuário</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-3">
                        <label for="{{ form.password.id_for_label }}" class="form-label">Senha</label>
                        {{ form.password }}
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                    <input type="hidden" name="next" value="{{ next }}">
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
