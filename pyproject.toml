[project]
name = "ebd"
version = "0.1.0"
description = "Controle de Secretaria da EBD"
readme = "README.md"
authors = [
    { name = "João Barboasa", email = "iotabe@iotabe.adm.br" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
    "python-decouple>=3.8",
    "dj-database-url>=2.3",
    "gunicorn>=26.0.0",
    "whitenoise>=6.12.0",
]

[project.scripts]
ebd = "ebd:main"

[build-system]
# setuptools: funciona com `pip install -e .` em qualquer servidor (sem exigir
# o binário `uv` no build). O backend anterior (uv_build) só compila com uv.
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
# Garante que templates e estáticos do app entrem na instalação
include-package-data = true

[tool.setuptools.package-data]
"ebd.core" = ["templates/**/*.html", "static/**/*", "management/commands/*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

