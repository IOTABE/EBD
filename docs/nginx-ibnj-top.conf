# Configuração Nginx de referência para o site ibnj.top
#
# Como usar no painel BaoTa:
#   1. No site ibnj.top, abra "Configuração" e cole este bloco no server {};
#   2. Ajuste o caminho de root/alias caso o deploy esteja em outro diretório;
#   3. Garanta que o gunicorn esteja rodando em 127.0.0.1:8004 (ou ajuste o proxy_pass);
#   4. Depois do deploy rode: python manage.py collectstatic --noinput.

server {
    server_name ibnj.top www.ibnj.top;
    root /www/wwwroot/ibnj.top/src;

    location ^~ /static/ {
        alias /www/wwwroot/ibnj.top/src/staticfiles/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}