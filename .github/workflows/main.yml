name: Deploy para Servidor de Produção

on: 
  push:
    branches:
      - master  # Executa o deploy sempre que houver um push na branch master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Executar comandos via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: 
            # 1. Navegar até o diretório do projeto
            cd /www/wwwroot/ibnj.top

            # 2. Baixar as atualizações do repositório
            git pull origin master

            # 3. Ativar a venv e atualizar dependências (se houver)
            source venv/bin/activate
            pip install -r requirements.txt

            # 4. Rodar migrações do banco e coletar arquivos estáticos
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput

            # 5. Reiniciar o Gunicorn e Nginx para aplicar as alterações
            # Exemplo via Supervisor/Systemd ou sinal do Gunicorn:
            pkill -HUP -f gunicorn || systemctl restart nginx
